[workspace]
resolver = "2"
members = [
    "crates/magpie-log",
    "crates/magpie-claims",
    "crates/magpie-episodic",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/noctem-o/magpie"
readme = "README.md"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
ed25519-dalek = "2"
thiserror = "1"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
