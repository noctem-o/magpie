name: CI

on:
  push:
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-24.04
    env:
      MAGPIE_CANDIDATE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MAGPIE_RUNNER_LABEL: ubuntu-24.04
      MAGPIE_RUST_TOOLCHAIN: '1.98.1'
      RUSTUP_TOOLCHAIN: '1.98.1'
      MAGPIE_WORKFLOW_SHA: ${{ github.workflow_sha }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install Rust 1.98.1
        run: |
          rustup toolchain install 1.98.1 --profile minimal --component rustfmt,clippy
          rustup default 1.98.1
          test "$(rustc --version | awk '{print $2}')" = "$MAGPIE_RUST_TOOLCHAIN"
          test "$(cargo --version | awk '{print $2}')" = "$MAGPIE_RUST_TOOLCHAIN"
          rustc -Vv
          cargo --version

      - name: Install Python 3.12.14 for isolated conformer subprocesses
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.12.14'

      - name: Install Go 1.27.0
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: '1.27.0'
          check-latest: false
          cache: false

      - name: Constrain Go module access after toolchain setup
        shell: bash
        run: |
          {
            echo 'GOENV=off'
            echo 'GOFLAGS='
            echo 'GONOPROXY='
            echo 'GONOSUMDB='
            echo 'GOPRIVATE='
            echo 'GOPROXY=off'
            echo 'GOSUMDB=off'
            echo 'GOTOOLCHAIN=local'
            echo 'GOVCS=*:off'
            echo 'GOWORK=off'
            echo "GOMODCACHE=$RUNNER_TEMP/magpie-empty-mod-cache"
            echo "GOCACHE=$RUNNER_TEMP/magpie-go-build-cache"
          } >> "$GITHUB_ENV"

      - name: Cache Cargo build artifacts
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-rust-${{ env.MAGPIE_RUST_TOOLCHAIN }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Verify governed compile-fail diagnostics
        run: python tools/check_a018_diagnostics.py

      - name: Qualify SQLite L0 resource/crash/recovery evidence
        run: python tools/check_sqlite_l0_qualification.py

      - name: Check Rust formatting
        run: cargo fmt --all --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --no-fail-fast

      - name: Run magpie-log doctests
        run: cargo test --doc -p magpie-log --locked

      - name: Run governed-standing tour
        run: cargo run --locked --example tour -p magpie-claims

      - name: Check release metadata and package inventories
        run: python tools/check_release_metadata.py

      - name: Verify portable verifier corpus manifest
        run: python tools/check_verifier_corpus_manifest.py

      - name: Verify magpie-log package
        run: cargo package -p magpie-log --locked

      - name: Install Python verifier dependencies
        run: python -m pip install cryptography==50.0.0 -r tools/requirements-portable-verifier.txt

      - name: Record validation environment provenance
        run: python tools/emit_validation_environment.py

      - name: Unit-test Python conformer and differential harness
        run: >
          python -m unittest
          tools.test_portable_verifier
          tools.test_verify_chain
          tools.test_portable_verifier_differential
          tools.test_check_a018_diagnostics
          tools.test_check_sqlite_l0_qualification
          tools.test_emit_validation_environment
          -v

      - name: Verify Python portable conformer against frozen corpus
        run: python tools/check_portable_verifier_python.py

      - name: Check independent Go portable conformer formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l tools/go-verify-chain/*.go)"
          if [[ -n "$unformatted" ]]; then
            printf '%s\n' "$unformatted"
            exit 1
          fi

      - name: Test independent Go portable conformer from vendored source
        run: go -C tools/go-verify-chain test -mod=vendor -count=1 ./...

      - name: Vet independent Go portable conformer from vendored source
        run: go -C tools/go-verify-chain vet -mod=vendor ./...

      - name: Verify direct Go executable exit-code contract
        run: >
          go -C tools/go-verify-chain test -mod=vendor
          -run '^TestBuiltBinaryPreservesExitCodeContract$' -count=1 -v

      - name: Build governed Go executable from vendored source
        run: |
          mkdir -p "$RUNNER_TEMP/magpie-go-conformer"
          go -C tools/go-verify-chain build -mod=vendor -o "$RUNNER_TEMP/magpie-go-conformer/go-verify-chain" .

      - name: Verify frozen 432-case corpus through the Go executable
        run: |
          "$RUNNER_TEMP/magpie-go-conformer/go-verify-chain" --check-manifest "$GITHUB_WORKSPACE/fixtures/verifier-language-v1/manifest.json"

      - name: Differentially verify Rust, Python, and Go portable conformers
        run: python tools/check_portable_verifier_differential.py --repeat 2

      - name: Verify frozen golden chain
        # Trust root pinned here on purpose: the chain is self-describing, not
        # self-authenticating (FORMAT.md §5), so CI must not read the key out
        # of the chain it is verifying. This hex is the fixture's pinned
        # verifying key, the same anchor as EXPECTED_HASHES in tests/golden.rs.
        run: >
          python tools/verify_chain.py
          crates/magpie-log/testdata/golden-v1.jsonl
          ea4a6c63e29c520abef5507b132ec5f9954776aebebe7b92421eea691446d22c
